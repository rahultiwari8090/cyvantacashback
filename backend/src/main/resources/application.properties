server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/affiliate-app}
spring.data.mongodb.database=${MONGODB_DATABASE:affiliate-app}

app.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/affiliate-app}
app.mongodb.database=${MONGODB_DATABASE:affiliate-app}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:affiliate-app}

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

app.cors.origins=${APP_CORS_ORIGINS:*}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

server.forward-headers-strategy=native

admitad.client-id=${ADMITAD_CLIENT_ID}
admitad.client-secret=${ADMITAD_CLIENT_SECRET}

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMS Configuration (Twilio)
sms.provider=${SMS_PROVIDER:twilio}
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN}
sms.twilio.from-number=${TWILIO_FROM_NUMBER}
sms.twilio.service-id=${TWILIO_SERVICE_ID}